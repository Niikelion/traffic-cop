name: CI
on:
    pull_request:
    push:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Enable Corepack
              run: corepack enable
            - uses: actions/checkout@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  cache: 'yarn'
            - name: Install dependencies
              run: yarn install --immutable
            - name: Build
              run: yarn build
            - name: Lint
              run: yarn lint
            - name: Test
              run: yarn test

    changeset:
        # Require a changeset on PRs, except the automated version PR (which removes them).
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - name: Check for a changeset
              run: |
                  count=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
                  if [ "$count" -eq 0 ]; then
                      echo "No changeset found. Run 'yarn changeset' (an empty changeset is fine for changes that don't affect published packages)."
                      exit 1
                  fi
