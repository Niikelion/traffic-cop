name: Release
on:
    push:
        branches: [main]

concurrency: release-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # push tags, create the version PR branch
            pull-requests: write # open/update the "Version Packages" PR
            id-token: write # npm provenance
        steps:
            - name: Enable Corepack
              run: corepack enable
            - uses: actions/checkout@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  cache: 'yarn'
                  registry-url: 'https://registry.npmjs.org'
            - name: Install dependencies
              run: yarn install --immutable
            - name: Create Version PR or publish
              uses: changesets/action@v1
              with:
                  version: yarn changeset version
                  publish: yarn release
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
              env:
                  # A PAT or GitHub App token (NOT the default GITHUB_TOKEN) so the Version PR this
                  # action opens triggers the CI workflow and can satisfy required status checks.
                  GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
