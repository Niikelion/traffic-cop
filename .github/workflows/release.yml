name: Release
on:
    push:
        branches: [main]

concurrency: release-${{ github.ref }}

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            contents: write # create/update the version PR branch
            pull-requests: write # open/update the "Version Packages" PR
        steps:
            - name: Enable Corepack
              run: corepack enable
            - uses: actions/checkout@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  cache: 'yarn'
            - name: Install dependencies
              run: yarn install --immutable
            - name: Create or update the Version Packages PR
              uses: changesets/action@v1
              with:
                  version: yarn changeset version
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
              env:
                  # The built-in token — no secret to provide. It cannot trigger CI on the PR it
                  # opens, so admin-merge the Version Packages PR (its contents are generated).
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
