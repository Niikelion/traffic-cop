nodeLinker: node-modules

enableGlobalCache: true

# Yarn 4.15+ quarantines newly published versions for a cooldown window as a supply-chain
# guardrail. This repo consumes @signalbox/* packages we publish ourselves, so the gate is
# disabled here. Set a minute count (e.g. 4320 for 3 days) to re-enable, or scope it if Yarn
# adds a per-scope exclusion.
npmMinimalAgeGate: 0
